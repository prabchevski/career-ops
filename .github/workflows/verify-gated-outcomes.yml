name: Verify final gated evaluation head

on:
  push:
    branches: [codex/verify-gated-evaluation-outcomes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-gated-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 445c00fda5dddae3320753eac4e69f4d7345d6f5
          persist-credentials: false
      - name: Record tested feature commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'
          cache-dependency-path: dashboard/go.sum
      - name: Install root test dependencies without browser download
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Web typecheck
        run: npm run typecheck
        working-directory: web
      - name: Full root suite including dashboard build and web suites
        run: node test-all.mjs --jobs 4
      - name: Build production web app
        run: npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Canonical live-server Chrome browser suites
        run: npm run test:browser
        working-directory: web
