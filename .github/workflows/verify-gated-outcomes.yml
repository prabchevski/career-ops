name: Verify isolated review heads

on:
  push:
    branches: [codex/verify-gated-evaluation-outcomes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-root-only:
    name: Root-only full suite (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: gated-outcomes
            ref: 3f48b9cebdaa00bb620cb13e8931615dd16e8424
          - label: geography
            ref: 7bdb6ef19f0d52425c04a4dba9f63680dd0dc7c1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Record tested feature commit
        run: git rev-parse HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'
          cache-dependency-path: dashboard/go.sum
      - name: Install root test dependencies without browser download
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Full root suite with no web or Next dependencies installed
        run: node test-all.mjs --jobs 4
      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Web typecheck
        run: npm run typecheck
        working-directory: web
