name: Verify isolated review heads

on:
  push:
    branches: [codex/verify-gated-evaluation-outcomes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-root-only:
    name: Exact contribution (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: known-ats-prefetch
            ref: f47009af5a4e77509eb7bdb8e81a90c2694d0659
            base: 05ceb992d25c7870fc89823c88e75fcb7464b135
            files: {"lib/update-manifest.mjs":"44c28bd0c0435b57641ac2c32f45840d4fbf14573dfd853069d99777065e6790","modes/oferta.md":"b2fd4f2b5c75a647ffae31c75e6492b0781d4bd040ac301a29a3255f3439b0d2","read-known-jd.mjs":"500fb8d2c88c7e20ce788e586e09452c2d8a335aa07fbaf8d2f626e3afc9d7d1","tests/read-known-jd.test.mjs":"30ed1a383a50cd68fa0c82040415a6cea3e393e5a4d590f90463f41767e93db5","web/src/app/api/run/route.ts":"f8072f85a441e4c3fd8ca7303342dc008d263da24d59a54aeed302b66465318f","web/src/lib/evaluation-source.mjs":"173a7e718fc66f893ec00a1eaa2681d3900570b3519bacff3e5a48b727820cfb","web/src/lib/run-prompts.mjs":"fc9194cfa37938eb5276e96fbc532953ab516eba783bfbd58437560d724eddaf","web/tests/lib/evaluation-source-route.test.mjs":"c4fac7ce80e7cd7c05d836d6c085f79e0cae7ebaf645b58756c7ebcc3f10cd3c","web/tests/lib/evaluation-source.test.mjs":"e3f29b9d8b5395500f795209993b412b45d47d366f87b109a19f9b68de21cc97","web/tests/lib/run-prompts.test.mjs":"c6c090436e71fadac2e37eff976b1c6ad96cfffa044433a60dd01c3b20a9bdf9"}
    env:
      EXPECTED_HEAD: ${{ matrix.ref }}
      EXPECTED_BASE: ${{ matrix.base }}
      EXPECTED_FILES: ${{ toJson(matrix.files) }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'
          cache-dependency-path: dashboard/go.sum
      - name: Install root dependencies without browser download or web dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify exact head, code hashes and authoritative native path coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const head = process.env.EXPECTED_HEAD;
          const base = process.env.EXPECTED_BASE;
          assert.match(head, /^[a-f0-9]{40}$/);
          assert.match(base, /^[a-f0-9]{40}$/);
          assert.equal(git('rev-parse', 'HEAD'), head);
          git('merge-base', '--is-ancestor', base, head);
          git('diff', '--quiet');
          git('diff', '--cached', '--quiet');
          assert.equal(fs.existsSync('web/node_modules'), false);
          const expected = JSON.parse(process.env.EXPECTED_FILES);
          const changed = git('diff', '--name-only', base, head).split('\n').filter(Boolean).sort();
          assert.deepEqual(changed, Object.keys(expected).sort());
          const native = await import('./update-system.mjs');
          const { SYSTEM_PATHS } = await import('./lib/update-manifest.mjs');
          const committed = native.manifestSystemPathsAt(head, {
            has: file => { try { git('cat-file', '-e', `${head}:${file}`); return true; } catch { return false; } },
            show: file => git('show', `${head}:${file}`),
          });
          assert.deepEqual(committed.paths, SYSTEM_PATHS);
          const protectedPaths = native.effectiveUserPaths(process.cwd());
          assert.ok(Array.isArray(protectedPaths) && protectedPaths.length > 0);
          const actual = {};
          for (const file of changed) {
            assert.ok(!path.isAbsolute(file) && !file.split('/').includes('..'));
            const info = fs.lstatSync(file);
            assert.ok(info.isFile() && !info.isSymbolicLink(), file);
            const covered = file.startsWith('web/') || SYSTEM_PATHS.some(spec => spec.endsWith('/') ? file.startsWith(spec) : file === spec);
            assert.ok(covered, `Not in native deployment inventory: ${file}`);
            assert.ok(native.isSafeManifestPath(file.replace(/[\[\]]/g, ''), protectedPaths), file);
            actual[file] = createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(actual[file], expected[file], file);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'source-attestation.json'), JSON.stringify({ head, files: actual }));
          console.log(JSON.stringify({ exactHead: head, nativeVerifiedFiles: changed.length, noWebDependencies: true }));
          NODE
      - name: Record the existing full root suite disposition
        run: |
          node --input-type=module <<'NODE'
          console.log(JSON.stringify({ fullRootSuite: "FAILED_PREVIOUSLY_NOT_RERUN", run: 42032749776, job: 127263029122, sourceHead: process.env.EXPECTED_HEAD, passed: 20293, failed: 1, test: "tests/batch-runner-throttle-before-launch.test.mjs", observed: "Unmodified fixture reserve-report-num stub returned no valid number for offer 3; suite threw before assertions", downstreamOnly: true }));
          NODE
      - name: Root-only focused source-reader and evaluation regressions
        run: |
          test ! -d web/node_modules
          node --test tests/read-known-jd.test.mjs tests/main-guard-convention.test.mjs tests/help-flag-handled.test.mjs tests/update-manifest.test.mjs web/tests/lib/evaluation-source.test.mjs web/tests/lib/evaluation-source-route.test.mjs web/tests/lib/run-prompts.test.mjs web/tests/lib/codex-evaluate-lifecycle.test.mjs web/tests/lib/report-persist.test.mjs web/tests/lib/evaluation-options.test.mjs
      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Full web suite
        run: npm test
        working-directory: web
      - name: Web typecheck
        run: npm run typecheck
        working-directory: web
      - name: Production web build
        run: npm run build
        working-directory: web
      - name: Record compiled source-reader adapter evidence
        if: matrix.label == 'known-ats-prefetch'
        working-directory: web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          found = []
          for file in sorted(Path('.next/server').rglob('*.js')):
              text = file.read_text(errors='replace')
              if 'Invalid exact posting URL' not in text:
                  continue
              snippets = []
              for marker in ('Invalid exact posting URL', 'On a POSIX shell-only host'):
                  start = 0
                  for _ in range(3):
                      position = text.find(marker, start)
                      if position < 0:
                          break
                      snippets.append({'marker': marker, 'context': text[max(0, position - 600):position + 1000]})
                      start = position + len(marker)
              found.append({'path': str(file), 'sha256': hashlib.sha256(file.read_bytes()).hexdigest(), 'snippets': snippets})
          print(json.dumps({'compiled_adapter_evidence': found}))
          PY
      - name: Recheck exact head and frozen source bytes after every test and build
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const snapshot = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'source-attestation.json'), 'utf8'));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('rev-parse', 'HEAD'), snapshot.head);
          assert.equal(snapshot.head, process.env.EXPECTED_HEAD);
          git('diff', '--quiet');
          git('diff', '--cached', '--quiet');
          for (const [file, checksum] of Object.entries(snapshot.files)) {
            assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'), checksum, file);
          }
          console.log(JSON.stringify({ exactHead: snapshot.head, finalVerifiedSourceFiles: Object.keys(snapshot.files).length }));
          NODE
