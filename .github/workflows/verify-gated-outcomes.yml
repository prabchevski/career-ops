name: Verify isolated review heads

on:
  push:
    branches: [codex/verify-gated-evaluation-outcomes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-root-only:
    name: Exact contribution (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: web-evaluation-archive
            ref: ae74a3e3e4157a6520f96e104ba06aa6f88cb046
            base: 35b7c5315837478ae35316429669a954923ccd6b
            files: {"archive-posting.mjs":"00c1d97804cca24fa53307dddc6fb65fb7a7fc3f1389c8c7942558f2a985f6b9","check-jd-archive.mjs":"ecb7023023b8e90a9216fbaabec5a20d6c53e51697cb5279d1934af6304ebafd","lib/evaluation-archive.mjs":"e36d19b993b512a98bfb9e71062d5a19941f972541c7cb9f3aed811d95c8f7c3","lib/update-manifest.mjs":"816df98acb1c8ff76419739e3a5a441ce2ffe0d6e42f07a56e12fda45fa80300","persist-evaluation-report.mjs":"91e6b1528a99a933aba95927f16b71a57be0723d505414b4e56c9d5ef1ec767c","tests/archive-posting-non-content.test.mjs":"8290e2ba28abdc613b34c4a5cb3385649a7ea6aaae8d18d5f0e6258051cdb82d","tests/check-jd-archive-paraphrase.test.mjs":"d7c2c58634ddcbca04981d31c9fe9e66102853d06f3c587728527400baed3946","tests/evaluation-archive.test.mjs":"17eb145da4e821d43028213fdb0afbdd1c7e14d7c64ab65c3f421f471226b5a7","tests/persist-evaluation-report.test.mjs":"91381e781af72709ebfe2f0b32671c947695dfac8fd5032e5e0cf56b68d8104a","web/tests/lib/evaluation-archive-completeness.test.mjs":"22fabcc4b8704662677857fada35ef5177cd0abe4db0b0ab9f920aaacf620ee9","web/tests/lib/report-persist.test.mjs":"958f1391c06e95f7f84e24ba4ce117d070f4c4587dfe5895ed14500a86e9f6e5"}
          - label: tracker-employer-identity
            ref: 3a0342e6c82d17ea1c54ba76c483e6dccb387b93
            base: 35b7c5315837478ae35316429669a954923ccd6b
            files: {"merge-tracker.mjs":"e20833880b14197962121ef0789627e534c4175a94619ecb8f132b88817500e9","tests/merge-tracker-cross-source-identity.test.mjs":"7590045b772f698c199d1b217a39d156d50b2803f50653edb43744428b9f23be"}
    env:
      EXPECTED_HEAD: ${{ matrix.ref }}
      EXPECTED_BASE: ${{ matrix.base }}
      EXPECTED_FILES: ${{ toJson(matrix.files) }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'
          cache-dependency-path: dashboard/go.sum
      - name: Install root dependencies without browser download or web dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Verify exact head, code hashes and authoritative native path coverage
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const head = process.env.EXPECTED_HEAD;
          const base = process.env.EXPECTED_BASE;
          assert.match(head, /^[a-f0-9]{40}$/);
          assert.match(base, /^[a-f0-9]{40}$/);
          assert.equal(git('rev-parse', 'HEAD'), head);
          git('merge-base', '--is-ancestor', base, head);
          git('diff', '--quiet');
          git('diff', '--cached', '--quiet');
          assert.equal(fs.existsSync('web/node_modules'), false);
          const expected = JSON.parse(process.env.EXPECTED_FILES);
          const changed = git('diff', '--name-only', base, head).split('\n').filter(Boolean).sort();
          assert.deepEqual(changed, Object.keys(expected).sort());
          const native = await import('./update-system.mjs');
          const { SYSTEM_PATHS } = await import('./lib/update-manifest.mjs');
          const committed = native.manifestSystemPathsAt(head, {
            has: file => { try { git('cat-file', '-e', `${head}:${file}`); return true; } catch { return false; } },
            show: file => git('show', `${head}:${file}`),
          });
          assert.deepEqual(committed.paths, SYSTEM_PATHS);
          const protectedPaths = native.effectiveUserPaths(process.cwd());
          assert.ok(Array.isArray(protectedPaths) && protectedPaths.length > 0);
          const actual = {};
          for (const file of changed) {
            assert.ok(!path.isAbsolute(file) && !file.split('/').includes('..'));
            const info = fs.lstatSync(file);
            assert.ok(info.isFile() && !info.isSymbolicLink(), file);
            const covered = file.startsWith('web/') || SYSTEM_PATHS.some(spec => spec.endsWith('/') ? file.startsWith(spec) : file === spec);
            assert.ok(covered, `Not in native deployment inventory: ${file}`);
            assert.ok(native.isSafeManifestPath(file.replace(/[\[\]]/g, ''), protectedPaths), file);
            actual[file] = createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            assert.equal(actual[file], expected[file], file);
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'source-attestation.json'), JSON.stringify({ head, files: actual }));
          console.log(JSON.stringify({ exactHead: head, nativeVerifiedFiles: changed.length, noWebDependencies: true }));
          NODE
      - name: Full root suite in the root-only dependency environment
        run: |
          test ! -d web/node_modules
          node test-all.mjs --jobs 4
      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Full web suite
        run: npm test
        working-directory: web
      - name: Web typecheck
        run: npm run typecheck
        working-directory: web
      - name: Production web build
        run: npm run build
        working-directory: web
      - name: Recheck exact head and frozen source bytes after every test and build
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const snapshot = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'source-attestation.json'), 'utf8'));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('rev-parse', 'HEAD'), snapshot.head);
          assert.equal(snapshot.head, process.env.EXPECTED_HEAD);
          git('diff', '--quiet');
          git('diff', '--cached', '--quiet');
          for (const [file, checksum] of Object.entries(snapshot.files)) {
            assert.equal(createHash('sha256').update(fs.readFileSync(file)).digest('hex'), checksum, file);
          }
          console.log(JSON.stringify({ exactHead: snapshot.head, finalVerifiedSourceFiles: Object.keys(snapshot.files).length }));
          NODE
