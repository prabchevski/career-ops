name: Verify Source parity and review successors
on:
  push:
    branches: [codex/verify-source-validator-parity-20261105]
permissions:
  contents: read
jobs:
  source-main:
    name: Exact Source86ee validation parity full quality and emitted functions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve verification tools outside contribution checkout
        run: |
          cp -a .github/verification "$RUNNER_TEMP/source-parity-verification"
          echo "5ce00b1c0eda0a19f57783f13746e7dc0435d257a1da0e902dc6b6aad2cfe435  $RUNNER_TEMP/source-parity-verification/compiled-workday-proof.mjs" | sha256sum --check
      - name: Check out exact compatibility successor
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 86eea1d8695816d0ecddfbe2ddf92cd1a3b9c809
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install declared root dependencies only
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Attest all16 paths and both test-only changes over automatic main merge
        run: node "$RUNNER_TEMP/source-parity-verification/attest-source.mjs" before workday "$RUNNER_TEMP/source-parity-verification/axes.json" "$RUNNER_TEMP/source-parity-attestation.json"
      - name: First full root on the new composition before web dependencies
        run: |
          test ! -d web/node_modules
          node test-all.mjs --jobs 1
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Full web suite on the new composition
        working-directory: web
        run: npm test
      - name: Typecheck the new composition
        working-directory: web
        run: npm run typecheck
      - name: Fresh production build
        id: build
        working-directory: web
        run: npm run build
      - name: Execute actual emitted reader and adapter functions
        id: compiled
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 45s node "$RUNNER_TEMP/source-parity-verification/compiled-workday-proof.mjs" --root "$GITHUB_WORKSPACE" --attestation "$RUNNER_TEMP/source-parity-attestation.json" --proof "$RUNNER_TEMP/source-parity-compiled-proof.json" --variant public
      - name: Retain only bounded generated code on compiled failure
        if: failure() && steps.build.outcome == 'success' && steps.compiled.outcome == 'failure'
        run: node "$RUNNER_TEMP/source-parity-verification/capture-compiled-failure.mjs" --root "$GITHUB_WORKSPACE" --attestation "$RUNNER_TEMP/source-parity-attestation.json" --out "$RUNNER_TEMP/source-parity-failure-code"
      - name: Re-attest source and native inventory even after failure
        if: always() && steps.source.outcome == 'success'
        run: node "$RUNNER_TEMP/source-parity-verification/attest-source.mjs" after workday "$RUNNER_TEMP/source-parity-verification/axes.json" "$RUNNER_TEMP/source-parity-attestation.json"
      - name: Preserve actual new-head quality proof without re-running other axes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-parity-compat-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-parity-attestation.json
            ${{ runner.temp }}/source-parity-compiled-proof.json
            ${{ runner.temp }}/source-parity-failure-code/
          if-no-files-found: error

  first-full-roots:
    name: First full root on new ${{ matrix.axis }} successor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - axis: geo
            head: a795b7e92a8e4ea2ed6d9dac309994438ccb71d4
          - axis: tracker
            head: 0c30cfde8785e8617e550e94f9200d40c23dc8b0
          - axis: archive
            head: 58a2578096bd369ac95f190c6183e30b3f9885fe
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve exact verification tools outside contribution checkout
        run: cp -a .github/verification "$RUNNER_TEMP/new-root-verification"
      - name: Check out exact new root successor
        id: candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install declared root dependencies only
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Attest all PR paths and exact immediate-parent delta
        run: node "$RUNNER_TEMP/new-root-verification/attest-source.mjs" before "${{ matrix.axis }}" "$RUNNER_TEMP/new-root-verification/axes.json" "$RUNNER_TEMP/new-root-${{ matrix.axis }}.json"
      - name: First full root on this new head without web dependencies
        run: |
          test ! -d web/node_modules
          node test-all.mjs --jobs 1
      - name: Re-attest exact source and native inventory even after failure
        if: always() && steps.candidate.outcome == 'success'
        run: node "$RUNNER_TEMP/new-root-verification/attest-source.mjs" after "${{ matrix.axis }}" "$RUNNER_TEMP/new-root-verification/axes.json" "$RUNNER_TEMP/new-root-${{ matrix.axis }}.json"
      - name: Retain actual first new-head root proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: new-root-${{ matrix.axis }}-${{ github.sha }}
          path: ${{ runner.temp }}/new-root-${{ matrix.axis }}.json
          if-no-files-found: error

  allocator-diagnostic:
    name: One unchanged-assertion fictional allocator diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve the reviewed verification-only diagnostic
        run: cp .github/verification/diagnose-batch-counter.mjs "$RUNNER_TEMP/diagnose-batch-counter.mjs"
      - name: Check out the exact failed Source176 baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 176d63d9eaef73b953ddb0c7dba3279d35aa9f89
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Run the single diagnostic without changing fixture assertions or worker count
        run: timeout --signal=TERM --kill-after=5s 180s node "$RUNNER_TEMP/diagnose-batch-counter.mjs" --root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/batch-counter-diagnostic"
      - name: Retain bounded fictional diagnostics even when the original fixture fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: batch-counter-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/batch-counter-diagnostic/proof.json
            ${{ runner.temp }}/batch-counter-diagnostic/test.stdout.log
            ${{ runner.temp }}/batch-counter-diagnostic/test.stderr.log
            ${{ runner.temp }}/batch-counter-diagnostic/records/
          if-no-files-found: error
